<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | AssetVerify Property Services</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://your-username.github.io/assetverify/reset-password.html">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="reset">
  <header data-site-header></header>
  <main id="main">
    <section class="section">
      <div class="container" style="max-width:460px">
        <h1 class="text-center">Reset your password</h1>
        <div class="card">
          <div id="auth-alert"></div>

          <form id="request-form" novalidate>
            <p class="muted">Enter your email address and we will send you a secure link to set a new password.</p>
            <div class="field mb-4">
              <label for="email">Email address <span class="req">*</span></label>
              <input type="email" id="email" name="email" required autocomplete="email">
              <span class="error-text"></span>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Send reset link</button>
          </form>

          <form id="update-form" class="hidden" novalidate>
            <p class="muted">Choose a new password for your account.</p>
            <div class="field mb-4">
              <label for="new-password">New password <span class="req">*</span></label>
              <input type="password" id="new-password" name="password" required minlength="8" autocomplete="new-password">
              <span class="error-text"></span>
            </div>
            <div class="field mb-4">
              <label for="confirm-password">Confirm new password <span class="req">*</span></label>
              <input type="password" id="confirm-password" name="password2" required autocomplete="new-password">
              <span class="error-text"></span>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Update password</button>
          </form>
        </div>
        <p class="text-center mt-4"><a href="login.html">Back to sign in</a></p>
      </div>
    </section>
  </main>
  <footer data-site-footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var api = AssetVerify.api, ui = AssetVerify.ui;
      // Detect a recovery link (Supabase appends #access_token=…&type=recovery)
      var isRecovery = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search) || ui.qs("mode") === "update";
      if (isRecovery || (api.getUser() && ui.qs("mode") === "update")) {
        document.getElementById("request-form").classList.add("hidden");
        document.getElementById("update-form").classList.remove("hidden");
      }

      document.getElementById("request-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var form = e.target;
        if (!ui.validateRequired(form)) return;
        var btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
        try {
          await api.auth.resetPassword(form.email.value.trim());
          ui.showAlertRaw("#auth-alert", "If an account exists for that email, a reset link has been sent. Please check your inbox.", "success");
          form.reset();
        } catch (err) {
          ui.showAlert("#auth-alert", err.message || "Unable to send reset link.", "danger");
        } finally { btn.disabled = false; btn.textContent = "Send reset link"; }
      });

      document.getElementById("update-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var form = e.target;
        if (form.password.value.length < 8) { ui.setFieldError(form.password, "Use at least 8 characters."); return; }
        if (form.password.value !== form.password2.value) { ui.setFieldError(form.password2, "Passwords do not match."); return; }
        var btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Updating…";
        try {
          await api.auth.updatePassword(form.password.value);
          ui.showAlertRaw("#auth-alert", "Your password has been updated. You can now <a href='login.html'>sign in</a>.", "success");
          form.reset();
        } catch (err) {
          ui.showAlert("#auth-alert", err.message || "Unable to update password.", "danger");
        } finally { btn.disabled = false; btn.textContent = "Update password"; }
      });
    });
  </script>
</body>
</html>
